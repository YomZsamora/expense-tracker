version: '3.8'

services:

  expense-tracker:
    build: .
    command: sh -c "npm run migrate && npm run dev"
    ports:
      - "3030:3000"
    env_file:
      - ./.env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules 
    networks:
      - dev-infra

networks:
  dev-infra:
    external: true